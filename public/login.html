<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - MoonMart</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main" class="container">
    <div class="auth-card">
      <h1 id="title">Log in</h1>
      <p id="message" class="notice" role="status" aria-live="polite"></p>

      <form id="form" novalidate>
        <div class="field" id="name-field" hidden>
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" maxlength="50">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="72" required>
          <label class="show"><input id="show" type="checkbox"> Show password</label>
        </div>
        <button id="submit" class="btn btn-primary" type="submit">Log in</button>
      </form>

      <p class="switch">
        <span id="switch-text">New to MoonMart?</span>
        <button id="switch" class="link-btn" type="button">Create an account</button>
      </p>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script type="module" src="/js/layout.js"></script>
  <script type="module" src="/js/auth-page.js"></script>
</body>
</html>
